name: Deploy to host server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Test variable
        env:
          MY_VAR: ${{ vars.SERVER_HOST }}
        run: |
          if [ -z "$MY_VAR" ]; then
            echo "Error: MY_VAR is empty"
            exit 1
          else
            echo "Success: MY_VAR has length ${#MY_VAR}"
          fi

      - name: Test connectivity to server
        run: |
          echo "Host: ${{ vars.SERVER_HOST }}"
          ping -c 3 ${{ vars.SERVER_HOST }}
          ssh-keyscan -H ${{ vars.SERVER_HOST }}

      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install deps
        run: |
          npm install --save-dev typescript pug-cli tailwindcss@3 postcss autoprefixer
      
      - name: Build site
        run: npm run build
      
      - name: Deploy to server via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: dist/
          remote_path: ~/www/vpert-site/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}
